name: Redaction CD

# This is the main CI/CD pipeline of the the redaction system
parameters:
# User-specified environment to deploy to
- name: env
  default: 'Dev'
  values:
  - 'Dev'
  - 'Test'
  - 'Training'
  - 'Prod'

# trigger after build only
pr: none
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.24.2
  pipelines:
    - pipeline: build
      source: Redaction System Build
      trigger:
        branches:
          include:
            - main

extends:
  template: stages/wrapper_cd.yml@templates
  parameters:
    globalVariables:
      - template: pipelines/azure-pipelines-variables.yml@self
      - name: resourceGroup
        value: 'pins-rg-redaction-system-${{ lower(parameters.env) }}-uks'
      - name: signatureDetectorAppName
        value: 'pins-app-signature-detector-redaction-system-${{ lower(parameters.env) }}-uks'
    environments:
      - name: ${{ parameters.env }}
    deploymentStages:
      - name: Deploy
        deploymentJobs:
          - name: Deploy Receiver Functions
            steps:
              - bash: |
                  git clone --depth=1 --no-tags --revision="$(resources.pipeline.build.sourceCommit)" $(Build.Repository.Uri) .
                displayName: Checkout Build-Commit
              - download: build
                artifact: receiver-function
                displayName: Download receiver-function
              # Use the Azure CLI to deploy the zip file to the Function App in Azure.
              - task: AzureCLI@2
                displayName: 'Deploy to function app'
                inputs:
                  azureSubscription: 'Azure DevOps Pipelines - Redaction System - Deployment ${{ upper(parameters.env) }}'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    az functionapp deployment source config-zip \
                    --resource-group $(resourceGroup) \
                    --name 'pins-func-redaction-system-${{ lower(parameters.env) }}-uks' \
                    --src '$(Pipeline.Workspace)/build/receiver-function/receiver.zip' \
                    --build-remote true \
                    --verbose
                    python3 pipelines/scripts/wait_for_function_app_to_be_running.py -e ${{ parameters.env }} -d "receiver"
          - name: Deploy Processor Functions
            steps:
              - bash: |
                  git clone --depth=1 --no-tags --revision="$(resources.pipeline.build.sourceCommit)" $(Build.Repository.Uri) .
                displayName: Checkout Build-Commit
              - download: build
                artifact: redactor-function
                displayName: Download redactor-function

              # Use the Azure CLI to deploy the zip file to the Function App in Azure.
              - task: AzureCLI@2
                displayName: 'Deploy to function app'
                inputs:
                  azureSubscription: 'Azure DevOps Pipelines - Redaction System - Deployment ${{ upper(parameters.env) }}'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    az functionapp deployment source config-zip \
                    --resource-group $(resourceGroup) \
                    --name 'pins-func-processor-redaction-system-${{ lower(parameters.env) }}-uks' \
                    --src '$(Pipeline.Workspace)/build/redactor-function/redactor.zip' \
                    --build-remote true \
                    --verbose
                    python3 pipelines/scripts/wait_for_function_app_to_be_running.py -e ${{ parameters.env }}  -d "processor"
          - name: Deploy Signature detection
            steps:
              - template: ../steps/azure_web_app_deploy_slot.yml@templates
                parameters:
                  appName: pins-app-signature-detector-redaction-system-${{ lower(parameters.env) }}-uks
                  appResourceGroup: $(resourceGroup)
                  azurecrName: $(azurecrName)
                  repository: redaction-system/signature-detector
                  slot: default

              - task: AzureCLI@2
                displayName: 'Wait for healthy deployment'
                inputs:
                  azureSubscription: 'Azure DevOps Pipelines - Redaction System - Deployment ${{ upper(parameters.env) }}'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    set -e
                    echo "Waiting for App Service to become healthy..."
                    for i in $(seq 1 30); do
                      STATUS=$(az webapp show --resource-group $(resourceGroup) --name $(signatureDetectorAppName) --query state -o tsv)
                      if [ "$STATUS" = "Running" ]; then
                        echo "App Service is running."
                        exit 0
                      fi
                      echo "Status: $STATUS. Retrying in 10s..."
                      sleep 10
                    done
                    echo "App Service did not become healthy in time."
                    exit 1


      - name: Run Smoke Tests
        dependsOn:
          - Deploy
        deploymentJobs:
          - name: Run Smoke Tests
            steps:
              - checkout: self
                displayName: 'Checkout repo'

              - script: |
                  set -e
                  sudo add-apt-repository ppa:deadsnakes/ppa -y
                  sudo apt-get update
                  sudo apt-get -o DPkg::Lock::Timeout=180 install -y python3.13 python3.13-venv python3.13-dev libffi-dev
                  sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.13 1
                  python3 -m ensurepip --upgrade
                  python3 -m pip install --force-reinstall --no-binary cffi cffi
                  python3 --version
                displayName: 'Install Python 3.13'

              # Run a quick smoke test to check connectivity
              - task: AzureCLI@2
                displayName: 'Run function app smoke test'
                inputs:
                  azureSubscription: 'Azure DevOps Pipelines - Redaction System - Deployment ${{ upper(parameters.env) }}'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    python3 -m pip install pytest
                    python3 -m pip install dotenv
                    python3 -m pytest redactor/test/smoke_test/test_connectivity.py
                    

              - task: AzureCLI@2
                displayName: Test signature detection
                inputs:
                  azureSubscription: 'Azure DevOps Pipelines - Redaction System - Deployment ${{ upper(parameters.env) }}'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    set -e
                    python3 redactor/test/smoke_test/test_signature_detector_endpoint.py --endpoint-url https://$(signatureDetectorAppName).azurewebsites.net/score --image $(Build.SourcesDirectory)/redactor/test/resources/image/image_with_signature.png
