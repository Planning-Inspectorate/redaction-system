name: Custom Vision Model CD Pipeline

# This is the main CI/CD pipeline of the the redaction system
parameters:
# User-specified environment to deploy to
- name: env
  default: 'dev'
  values:
  - 'dev'
  - 'test'
  #- 'prod'

pr: none

# Run when merged into main
trigger:
  branches:
    include:
      - main

  repositories:
    - repository: templates
      type: github
      endpoint: Planning-Inspectorate
      name: Planning-Inspectorate/common-pipeline-templates
      ref: refs/tags/release/3.24.2

extends:
  template: stages/wrapper_cd.yml@templates

  parameters:
    globalVariables:
      - template: pipelines/azure-pipelines-variables.yml@self
    customVisionTrainProjectId: $(CUSTOM_VISION_TRAIN_PROJECT_ID_${{ upper(parameters.env) }})
    customVisionTrainEndpoint: $(CUSTOM_VISION_TRAIN_ENDPOINT_${{ upper(parameters.env) }})
    customVisionPredProjectId: $(CUSTOM_VISION_PRED_PROJECT_ID_${{ upper(parameters.env) }})
    customVisionPredEndpoint: $(CUSTOM_VISION_PRED_ENDPOINT_${{ upper(parameters.env) }})
    storageAccountName: $(STORAGE_NAME_${{ upper(parameters.env) }})
    containerName: customvision-models

    environments:
      - name: ${{ parameters.env }}

    deploymentStages:
    - name: Export Model from Dev
      deploymentJobs:
      - name: Export Model from Dev
        steps:
        - checkout: self
          displayName: 'Checkout repo'

        - script: |
            set -e
            sudo add-apt-repository ppa:deadsnakes/ppa -y
            sudo apt-get update
            sudo apt-get -o DPkg::Lock::Timeout=180 install -y python3.13 python3.13-venv python3.13-dev libffi-dev
            sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.13 1
            python3 -m ensurepip --upgrade
            python3 -m pip install --force-reinstall --no-binary cffi cffi
            python3 --version
          displayName: 'Install Python 3.13'

        - script: |
            python3 -m pip install azure-cognitiveservices-vision-customvision
            python3 pipelines/scripts/export_cv_model.py \
              --project-id $(customVisionTrainProjectId) \
              --endpoint $(customVisionTrainEndpoint) \
              --output $(modelFileName)
          displayName: 'Export model using Custom Vision API'

        - task: AzureCLI@2
          displayName: 'Upload model to Storage'
          inputs:
            azureSubscription: '<your-service-connection>'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              az storage blob upload \
                --account-name $(storageAccountName) \
                --container-name $(containerName) \
                --file $(modelFileName) \
                --name $(modelFileName)

    - name: Import Model to Target Environment
      dependsOn: Export Model from Dev
      deploymentJobs:
      - name: Import Model to Target Environment
        steps:
        - checkout: self
          displayName: 'Checkout repo'

        - task: AzureCLI@2
          displayName: 'Download model from Storage'
          inputs:
            azureSubscription: '<your-service-connection>'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              az storage blob download \
                --account-name $(storageAccountName) \
                --container-name $(containerName) \
                --name $(modelFileName) \
                --file $(modelFileName)

        - script: |
            set -e
            sudo add-apt-repository ppa:deadsnakes/ppa -y
            sudo apt-get update
            sudo apt-get -o DPkg::Lock::Timeout=180 install -y python3.13 python3.13-venv python3.13-dev libffi-dev
            sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.13 1
            python3 -m ensurepip --upgrade
            python3 -m pip install --force-reinstall --no-binary cffi cffi
            python3 --version
          displayName: 'Install Python 3.13'

        - script: |
            python3 -m pip install azure-cognitiveservices-vision-customvision
            python3 pipelines/scripts/import_cv_model.py \
              --project-id $(customVisionPredProjectId) \
              --endpoint $(customVisionPredEndpoint) \
              --input $(modelFileName)
          displayName: 'Import model using Custom Vision API'